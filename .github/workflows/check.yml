name: Check products
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema>=4.26,<5' 'Pillow>=11,<13'
      - run: python -m unittest discover -s tests
      - run: zsh scripts/build-products.sh
